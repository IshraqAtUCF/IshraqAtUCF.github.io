  <!-- Self-contained page. Fonts are self-hosted (assets/fonts/) so the card
       still makes zero third-party requests on conference wifi; both files
       are variable woff2 covering weights 400-500, latin subset. -->
  <style>
    @font-face {
      font-family: "Newsreader";
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;
      src: url("assets/fonts/newsreader-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Spline Sans Mono";
      font-style: normal;
      font-weight: 400 500;
      font-display: swap;

    body { margin: 0; background: #efece4; font-family: "Newsreader", Georgia, serif; }
    .wrap {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      box-sizing: border-box;
      background: radial-gradient(80rem 50rem at 50% -20%, #f7f4ec, #eae6da);
    }
    .card {
      width: min(26rem, 100%);
      background: #10192e;
      border-radius: 22px;
      padding: clamp(1.8rem, 5vw, 2.6rem);
      box-sizing: border-box;
      box-shadow: 0 30px 60px rgba(16, 25, 46, 0.28), 0 2px 8px rgba(16, 25, 46, 0.18);
      position: relative;
      overflow: hidden;
    }
    /* Soft gold glow in the top corner — a gradient, not a pattern. */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(30rem 18rem at 85% -10%, rgba(201, 168, 76, 0.13), transparent 60%);
      pointer-events: none;
    }
    .card > * { position: relative; }

    .eyebrow { display: flex; align-items: center; justify-content: space-between; }
    .eyebrow span:first-child {
      font-family: "Spline Sans Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c9a84c;
    }
    .eyebrow span:last-child { width: 8px; height: 8px; border-radius: 50%; background: #c9a84c; }

    h1 {
      margin: 0.9rem 0 0;
      font-size: clamp(2.1rem, 8vw, 2.7rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.015em;
      color: #f5f2ea;
    }
    .role { margin: 0.7rem 0 0; font-size: 1.06rem; color: rgba(245, 242, 234, 0.65); line-height: 1.5; }
    .bio {
      margin: 1.4rem 0 0;
      padding-top: 1.3rem;
      border-top: 1px solid rgba(245, 242, 234, 0.14);
      font-size: 1rem;
      color: rgba(245, 242, 234, 0.8);
      line-height: 1.6;
    }

    .links { margin-top: 1.6rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      padding: 0 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(245, 242, 234, 0.16);
      color: #f5f2ea;
      font-family: "Spline Sans Mono", ui-monospace, monospace;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .links a:hover { border-color: #c9a84c; background: rgba(201, 168, 76, 0.08); }
    .links a b { color: #c9a84c; font-weight: 400; }
    /* The two "get" actions read slightly stronger than the four "visit" links. */
    .links a.get { border-color: rgba(201, 168, 76, 0.45); }
    .links a:focus-visible { outline: 2px solid #c9a84c; outline-offset: 2px; }

    .foot {
      margin: 1.6rem 0 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "Spline Sans Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(245, 242, 234, 0.45);
    }
    /* The minimal way home: the domain in the foot is the link to the site. */
    .foot a { color: rgba(245, 242, 234, 0.45); text-decoration: none; }
    .foot a:hover { color: #c9a84c; }
