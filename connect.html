<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to /hello | Ishraq Tashdid</title>

  <!-- /connect is a spoken-aloud alias for /hello. GitHub Pages has no
       server-side redirects (_redirects is Netlify, .htaccess is Apache), so
       this is a client-side stub with three independent fallbacks: meta
       refresh, a JS replace, and a visible link for anything that honours
       neither. The QR code encodes /hello directly, so this path is only ever
       reached by someone typing the alias. -->
  <meta http-equiv="refresh" content="0; url=/hello" />
  <link rel="canonical" href="https://ishraqtashdid.com/hello" />
  <meta name="robots" content="noindex" />

  <meta name="theme-color" content="#10192e" />
  <link rel="icon" href="favicon.png" sizes="32x32" />

  <style>
    body { margin: 0; background: #efece4; font-family: ui-monospace, monospace; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; text-align: center; }
    p { font-size: 0.85rem; letter-spacing: 0.06em; color: #10192e; }
    a { color: #8a6a1a; }
  </style>

  <!-- replace() rather than assign() so the redirect doesn't trap the back button. -->
  <script>window.location.replace("/hello");</script>
</head>
<body>
  <div class="wrap">
    <p>Taking you to <a href="/hello">ishraqtashdid.com/hello</a>&hellip;</p>
  </div>
</body>
</html>
